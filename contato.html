<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=5c3b72cb-42b6-45a0-8b35-8f3871ac0779
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contato · YOUP</title>
  <meta name="description" content="Fale com a YOUP. You imagine. We create.">
  <meta name="theme-color" content="#14091c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261003">
</head>
<body data-page="contato">
<div class="intro" id="intro" aria-hidden="true">
  <span class="intro__marca">youp</span>
</div>
<noscript><style>.intro{display:none}</style></noscript>

<main id="conteudo">

  <section class="section contato-sec">
    <div class="wrap">
      <h1 class="display-l" data-reveal><span class="split-line"><span>Conte o que</span></span><span class="split-line"><span>a marca imagina.</span></span></h1>

      <div class="contact">
        <!-- Para receber as mensagens por um serviço (ex.: Formspree), preencha data-endpoint com a URL. -->
        <form class="carta" id="form-contato" data-endpoint="" novalidate data-reveal>
          <p class="carta__texto">
            Olá YOUP, meu nome é
            <span class="lacuna"><input id="f-nome" name="nome" type="text" required autocomplete="name" aria-label="Seu nome" placeholder="seu nome" size="12"></span>
            e eu falo pela
            <span class="lacuna"><input id="f-empresa" name="empresa" type="text" autocomplete="organization" aria-label="Sua empresa" placeholder="sua empresa" size="13"></span>.
            Vocês podem me responder em
            <span class="lacuna"><input id="f-email" name="email" type="email" required autocomplete="email" aria-label="Seu e-mail" placeholder="seu@email.com" size="15"></span>
            ou no
            <span class="lacuna"><input id="f-tel" name="telefone" type="tel" inputmode="tel" autocomplete="tel" aria-label="Seu telefone" placeholder="seu telefone" size="14"></span>.
          </p>

          <label class="carta__rotulo" for="f-msg">O que a gente vai criar junto</label>
          <textarea id="f-msg" name="mensagem" required rows="5" placeholder="O projeto, o prazo, o que já existe e o que ainda é só ideia."></textarea>

          <p class="carta__nota">Empresa e telefone são opcionais. O resto a gente combina por e-mail.</p>
          <p class="carta__erro" id="carta-erro" role="alert"></p>

          <button class="btn btn--solid" type="submit">Enviar mensagem <svg class="arrow" width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M0 6h16M11 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>

        <aside class="contact-info-bloco" data-reveal data-reveal-delay="1">
          <dl class="contact-info" id="contato-info"></dl>
        </aside>
      </div>
    </div>
  </section>

</main>
<script src="assets/js/data.js?v=20261003"></script>
<script src="assets/js/main.js?v=20261003"></script>
</body>
</html>
